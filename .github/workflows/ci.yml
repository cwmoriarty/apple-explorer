name: CI and Portable Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  linux-and-windows-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE3 and MinGW-w64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev gcc-mingw-w64-x86-64 zip

      - name: Build and Run Unit + ASan + Fuzz Suites (Linux)
        run: |
          make CFLAGS="-O2 -Wall -Wextra -Werror -std=c11"
          make check
          make check-asan
          make check-fuzz

      - name: Cross-Compile Portable Windows x64 GUI and CLI
        run: |
          make win32-portable
          ls -lh build/win32-portable/
          VERSION="${GITHUB_REF_NAME:-dev}"
          (cd build/win32-portable && zip -r "../../apple-explorer-${VERSION}-windows-x64-portable.zip" AppleExplorer.exe apple-explorer.exe README.md LICENSE)
          shasum -a 256 "apple-explorer-${VERSION}-windows-x64-portable.zip"

      - name: Upload Portable Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-explorer-windows-x64-portable
          path: apple-explorer-*-windows-x64-portable.zip

      - name: Attach Portable Windows ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apple-explorer-*-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
